<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10" width="100%" height="100%" style="image-rendering: pixelated;">
  <!-- Claude Code Retro Bug/Robot Sprite (16x10 Grid) -->
  <g fill="#D97753">
    <!-- Main Body and Head -->
    <rect x="4" y="2" width="8" height="6" />

    <!-- Left Antenna / Arm -->
    <rect x="1" y="4" width="3" height="2" />

    <!-- Right Antenna / Arm -->
    <rect x="12" y="4" width="3" height="2" />

    <!-- Front/Left Leg -->
    <rect x="5" y="8" width="1" height="2" />

    <!-- Back/Right Leg -->
    <rect x="10" y="8" width="1" height="2" />
  </g>

  <!-- Eyes -->
  <g fill="#FFFFFF">
    <rect x="5" y="4" width="1" height="2" />
    <rect x="10" y="4" width="1" height="2" />
  </g>
</svg>
